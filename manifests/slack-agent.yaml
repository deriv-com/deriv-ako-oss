display_information:
  name: AKO
  description: "Release manager: picks up ready work, opens releases and asks for approval."
  background_color: "#1d2a44"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: ako
    always_online: true
  assistant_view:
    assistant_description: Ask AKO to start a release, check what's ready, or approve one.
    suggested_prompts:
      - title: What's ready?
        message: what's ready to release?
      - title: Start a release
        message: create a release
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:read
      - chat:write
      - groups:read
      - im:history
      - usergroups:read
      - users:read
      - assistant:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - assistant_thread_started
      - assistant_thread_context_changed
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
